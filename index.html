<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhythm Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mic.css">
    <link rel="stylesheet" href="css/note.css">
    <link rel="stylesheet" href="css/select.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Menu Principal -->
        <div id="menu-overlay" class="overlay">
            <h1>Rhythm Beat</h1>
            <p class="highscore-display">Recorde: <span id="menu-highscore">0</span></p>

            <div class="selector-group">
                <h3>Instrumento</h3>
                <select id="instrument-select" class="game-select">
                    <option value="piano">Piano</option>
                    <option value="guitar">Guitarra</option>
                    <option value="drums">Bateria</option>
                    <option value="violin">Violino</option>
                    <option value="flute">Flauta</option>
                    <option value="cavaquinho">Cavaquinho</option>
                    <option value="acoustic">Violão</option>
                    <option value="saxophone">Saxofone</option>
                    <option value="8bit">8-Bit</option>
                </select>
            </div>

            <div class="selector-group">
                <h3>Música</h3>
                <select id="song-select" class="game-select">
                    <option value="tutorial">Tutorial</option>
                    <option value="song1">Neon Lights</option>
                    <option value="song2">Cyber Chase</option>
                    <option value="song3">Samba Beat</option>
                    <option value="song4">Baile Funk</option>
                    <option value="odetojoy">Ode to Joy</option>
                    <option value="furelise">Fur Elise</option>
                </select>
            </div>

            <button id="btn-start" class="btn-primary">JOGAR</button>

            <div id="mic-test-container">
                <button id="btn-mic-test" class="btn-secondary">Testar Microfone</button>
                <div id="mic-visualizer" class="hidden">
                    <div id="mic-bar"></div>
                </div>
            </div>
        </div>

        <!-- HUD (Heads Up Display) -->
        <div id="hud-overlay" class="hidden">
            <div class="top-hud">
                <div id="score">Score: 0</div>
                <div id="combo">Combo: 0</div>
            </div>

            <div id="health-container">
                <div id="health-bar"></div>
            </div>

            <div id="fever-container">
                 <div id="fever-bar"></div>
                 <div id="fever-text">FEVER!</div>
            </div>

            <button id="btn-menu" class="btn-small">Menu</button>
        </div>

        <div id="detected-note-container">
            🎤: <span id="detected-note">...</span>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-overlay" class="overlay hidden">
            <h2>Fim de Jogo</h2>
            <p>Score Final: <span id="final-score">0</span></p>
            <p>Max Combo: <span id="max-combo">0</span></p>
            <button id="btn-restart" class="btn-primary">Jogar Novamente</button>
            <button id="btn-return-menu" class="btn-secondary">Menu Principal</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/songs.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
